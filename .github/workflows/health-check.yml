name: Repository Health Check

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required files
        id: check-files
        run: |
          FILES_MISSING=""
          
          # Check for required community health files
          REQUIRED_FILES=(
            "README.md"
            "LICENSE"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              FILES_MISSING="$FILES_MISSING\n- $file"
            fi
          done
          
          if [ -n "$FILES_MISSING" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo -e "$FILES_MISSING" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for missing files
        if: steps.check-files.outputs.missing == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = `${{ steps.check-files.outputs.files }}`;
            const body = `## Repository Health Check Alert
            
            The following required community health files are missing:
            ${files}
            
            Please add these files to maintain repository health and community standards.
            
            For more information, see:
            - [GitHub Community Health Files](https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file)
            - [Sage.is .github repository](https://github.com/Sage-is/.github)
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🏥 Repository Health Check: Missing Required Files',
              body: body,
              labels: ['health-check', 'documentation']
            });

      - name: Check branch protection
        run: |
          echo "Branch protection check would run here"
          echo "This requires additional API permissions"

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for outdated dependencies
        run: |
          echo "Checking for dependency files..."
          
          # Check for various dependency files
          if [ -f "package.json" ]; then
            echo "Found package.json - npm/yarn project"
          fi
          
          if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            echo "Found Python dependency files"
          fi
          
          if [ -f "go.mod" ]; then
            echo "Found go.mod - Go project"
          fi
          
          if [ -f "Cargo.toml" ]; then
            echo "Found Cargo.toml - Rust project"
          fi
