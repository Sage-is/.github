name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue! We appreciate your contribution to this project. 
            
            A maintainer will review your issue soon. In the meantime, please make sure you've provided 
            all the necessary information and follow our [Code of Conduct](https://github.com/Sage-is/.github/blob/main/CODE_OF_CONDUCT.md).
            
            If you have any questions, feel free to ask in the comments!
          pr-message: |
            🎉 Thanks for opening your first pull request! We're excited to review your contribution.
            
            Please make sure that:
            - [ ] Your PR follows our [Contributing Guidelines](https://github.com/Sage-is/.github/blob/main/CONTRIBUTING.md)
            - [ ] All tests pass
            - [ ] You've added/updated documentation as needed
            - [ ] You've updated the CHANGELOG.md
            
            A maintainer will review your PR soon. Thanks for contributing to our project!
