name: 📝 Documentation
description: Suggest improvements to documentation
title: '[DOCS] '
labels: ['documentation', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation!

  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: Describe the documentation issue or improvement needed.
      placeholder: What needs to be improved?
    validations:
      required: true

  - type: checkboxes
    id: type
    attributes:
      label: Type of Documentation
      options:
        - label: README
        - label: API Documentation
        - label: Tutorial/Guide
        - label: Code Comments
        - label: Examples
        - label: Other

  - type: textarea
    id: current
    attributes:
      label: Current State
      description: Describe what the current documentation says (or doesn't say).
      placeholder: Current documentation...
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Changes
      description: Describe what you think the documentation should say instead.
      placeholder: Proposed documentation...
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: File Location
      placeholder: e.g., README.md, docs/api.md

  - type: input
    id: section
    attributes:
      label: Section
      placeholder: e.g., Installation, Configuration

  - type: textarea
    id: why
    attributes:
      label: Why This Matters
      description: Explain why this documentation change is important.
      placeholder: Why is this important?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or examples about the documentation issue here.
