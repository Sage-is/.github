    open-pull-requests-limit: 10
    reviewers:
      - "Sage-is/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Sage-is/maintainers"
    labels:
      - "dependencies"
      - "golang"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for Cargo/Rust
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
